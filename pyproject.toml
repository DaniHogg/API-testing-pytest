[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-testing"
version = "0.1.0"
description = "Python-based API testing repository"
dependencies = [
    "requests",
    "pytest",
    "pytest-json-report",
    "jsonschema",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: core happy-path checks that must always pass",
    "regression: broader coverage including error and edge-case paths",
]